apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: aiops
  source:
    repoURL: https://github.com/brucorreia/aiops-observability-demo.git
    targetRevision: HEAD
    path: infra/apps/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
