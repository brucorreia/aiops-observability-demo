apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aiops
  namespace: argocd
spec:
  description: Local AIOps demo
  sourceRepos:
    - https://github.com/brucorreia/aiops-observability-demo.git
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
