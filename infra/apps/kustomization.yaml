apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../deploy/overlays/local
images:
  - name: aiops-demo-app
    newName: ghcr.io/brucorreia/aiops-demo-app
    newTag: "ee21f58"
  - name: aiops-agent
    newName: ghcr.io/brucorreia/aiops-agent
    newTag: "ee21f58"
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: ai-agent
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
