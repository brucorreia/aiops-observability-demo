apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/demo-app
images:
  - name: aiops-demo-app
    newName: ghcr.io/brucorreia/aiops-demo-app
    newTag: "0294528"
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: SERVICE_NAME
            value: demo-app
