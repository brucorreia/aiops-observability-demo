apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: aiops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command: ["sh", "-c"]
          args:
            - while true; do curl -sS -o /dev/null http://demo-app/api || true; sleep 1; done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi

