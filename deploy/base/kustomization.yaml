apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - monitoring-namespace.yaml
  - demo-app.yaml
  - agent.yaml
configMapGenerator:
  - name: ai-agent-scoring
    namespace: monitoring
    files:
      - scoring.yaml
    options:
      disableNameSuffixHash: true
      annotations:
        aiops.demo/config: scoring
