apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: aiops-demo
  labels:
    app: demo-app
  annotations:
    aiops.demo/git-sha: "dev"
    aiops.demo/deployed-at: "2026-09-15T03:39:04Z"
    aiops.demo/image: "aiops-demo-app"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        aiops.demo/git-sha: "dev"
        aiops.demo/image: "aiops-demo-app"
    spec:
      containers:
        - name: demo-app
          image: aiops-demo-app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: demo-app
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: aiops-demo
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
